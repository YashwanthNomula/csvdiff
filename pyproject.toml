[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csvdiff"
version = "1.0.0"
description = "Beautiful column-aware diffs for CSV files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yashwanth Nomula" }]
dependencies = []

[project.scripts]
csvdiff = "csvdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
